# ==============================================================================
# Automated Rollback Pipeline for Best Buy Catalog Comparison Agent
# Reverts Cloud Run traffic to the previous known stable revision or rollback release.
# Integrates with Google Cloud Deploy and Cloud Run traffic controls.
# ==============================================================================
steps:
  # Step 1: Shift traffic via Cloud Deploy rollback or direct Cloud Run reversion
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'rollback-traffic'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        SERVICE_NAME="catalog-comparison-service"
        PIPELINE_NAME="catalog-service-pipeline"
        TARGET_REV="${_TARGET_REVISION}"

        if [ -z "$${TARGET_REV}" ]; then
          echo "Attempting Google Cloud Deploy rollback first..."
          LATEST_ROLLOUT=$(gcloud deploy rollouts list \
            --delivery-pipeline="$${PIPELINE_NAME}" \
            --region="${_REGION}" \
            --project="${_PROJECT_ID}" \
            --format="value(name)" 2>/dev/null | head -n 1 || true)

          if [ -n "$${LATEST_ROLLOUT}" ]; then
            echo "Executing rollback for rollout: $${LATEST_ROLLOUT}..."
            if gcloud deploy rollouts rollback "$${LATEST_ROLLOUT}" \
              --delivery-pipeline="$${PIPELINE_NAME}" \
              --region="${_REGION}" \
              --project="${_PROJECT_ID}" \
              --quiet 2>/dev/null; then
              echo "Cloud Deploy rollback initiated."
            fi
          fi

          echo "Resolving preceding stable Cloud Run revision..."
          TARGET_REV=$(gcloud run revisions list \
            --service="$${SERVICE_NAME}" \
            --region="${_REGION}" \
            --project="${_PROJECT_ID}" \
            --sort-by="~metadata.creationTimestamp" \
            --format="value(metadata.name)" | sed -n '2p')
        fi

        if [ -z "$${TARGET_REV}" ]; then
          echo "ERROR: Unable to identify a prior revision to rollback to."
          exit 1
        fi

        echo "Enforcing 100% traffic to stable revision: $${TARGET_REV}..."
        gcloud run services update-traffic "$${SERVICE_NAME}" \
          --region="${_REGION}" \
          --project="${_PROJECT_ID}" \
          --to-revisions="$${TARGET_REV}=100"

  # Step 2: Verify post-rollback service health
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify-health'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        SERVICE_NAME="catalog-comparison-service"
        SERVICE_URL=$(gcloud run services describe "$${SERVICE_NAME}" \
          --region="${_REGION}" \
          --project="${_PROJECT_ID}" \
          --format="value(status.url)")

        echo "Verifying health on restored service: $${SERVICE_URL}/health"
        curl -sf --retry 5 --retry-delay 2 "$${SERVICE_URL}/health"
        echo "Rollback verification confirmed healthy."

substitutions:
  _REGION: 'us-central1'
  _PROJECT_ID: 'fde-bestbuy-sandbox-dev-508321'
  _TARGET_REVISION: ''

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '600s'
