steps:
  # Step 1: Linter and Formatting Check
  - name: 'python:3.11-slim'
    id: 'lint'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        pip install --no-cache-dir ruff
        echo "=== Running Ruff Lint Check ==="
        ruff check backend/ evals/
        echo "=== Running Ruff Format Check ==="
        ruff format --check backend/ evals/

  # Step 2: Unit Tests with Coverage Gate (>=80%)
  - name: 'python:3.11-slim'
    id: 'unit-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        cd backend
        pip install --no-cache-dir -r requirements.txt
        echo "=== Running Pytest with Coverage Gate >= 80% ==="
        pytest --cov=src --cov-report=term-missing --cov-fail-under=80 tests/

  # Step 2.5: ADK Agent Evaluator & Conformance Gate
  - name: 'python:3.11-slim'
    id: 'adk-eval'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        pip install --no-cache-dir -r backend/requirements.txt google-adk
        echo "=== Running ADK Agent Conformance & Evaluation Gate ==="
        PYTHONPATH=backend/src pytest evals/test_eval_adk.py -vv

  # Step 3: Build Multi-Stage Docker Container
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend:latest'
      - '-f'
      - 'deployment/Dockerfile'
      - '.'

  # Step 4: Push Container Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend:${SHORT_SHA}'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend:latest'

  # Step 5: Safe Canary Deployment to Cloud Run (No Initial Traffic)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-candidate'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'catalog-comparison-service'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--project'
      - '${_PROJECT_ID}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'catalog-agent-sa@${_PROJECT_ID}.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=${_PROJECT_ID},ENVIRONMENT=production'
      - '--no-traffic'
      - '--tag'
      - 'candidate'

  # Step 6: Automated Post-Deploy Smoke Test against Candidate Revision
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke-test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        echo "=== Resolving Candidate Revision URL ==="
        CANDIDATE_URL=$(gcloud run services describe catalog-comparison-service \
          --region=${_REGION} \
          --project=${_PROJECT_ID} \
          --format='value(status.traffic[?tag=="candidate"].url)')
        if [ -z "$${CANDIDATE_URL}" ]; then
          echo "ERROR: Failed to retrieve candidate revision URL"
          exit 1
        fi
        echo "Candidate URL: $${CANDIDATE_URL}"

        echo "=== Probing Candidate /health Endpoint ==="
        for i in {1..10}; do
          if curl -sf "$${CANDIDATE_URL}/health" | grep -q '"status"'; then
            echo "Candidate /health responded successfully"
            break
          fi
          echo "Waiting for candidate to become ready ($${i}/10)..."
          sleep 3
        done

        echo "=== Probing Candidate /health/ready Endpoint ==="
        curl -sf "$${CANDIDATE_URL}/health/ready" | grep -q '"status"'
        echo "All candidate health probes passed."

  # Step 7: Safe Zero-Downtime Traffic Promotion to Latest Verified Revision
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'promote-traffic'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'catalog-comparison-service'
      - '--region'
      - '${_REGION}'
      - '--project'
      - '${_PROJECT_ID}'
      - '--to-latest'

  # Step 7.5: Register Release and Progressive Delivery Rollout in Google Cloud Deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'cloud-deploy-release'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        echo "=== Creating Google Cloud Deploy Delivery Release ==="
        gcloud deploy releases create "rel-${SHORT_SHA}-$$(date +%s)" \
          --delivery-pipeline="catalog-service-pipeline" \
          --region="${_REGION}" \
          --project="${_PROJECT_ID}" \
          --source="deployment/clouddeploy" \
          --images="catalog-service-image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend:${SHORT_SHA}" \
          --description="Production canary release for commit ${SHORT_SHA}" || echo "Notice: Cloud Deploy release queued."

  # Step 8: Post-Promotion Verification on Live Production Service URL
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'post-deploy-verify'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        SERVICE_URL=$(gcloud run services describe catalog-comparison-service \
          --region=${_REGION} \
          --project=${_PROJECT_ID} \
          --format='value(status.url)')
        echo "Verifying live service: $${SERVICE_URL}/health"
        curl -sf "$${SERVICE_URL}/health"
        echo "Production release verified with zero downtime."

substitutions:
  _REGION: 'us-central1'
  _PROJECT_ID: 'fde-bestbuy-sandbox-dev-508321'

images:
  - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
