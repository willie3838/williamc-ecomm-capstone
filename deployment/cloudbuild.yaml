steps:
  # Step 1: Linter and Formatting Check
  - name: 'python:3.11-slim'
    id: 'lint'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        pip install --no-cache-dir ruff
        echo "=== Running Ruff Lint Check ==="
        ruff check backend/ evals/
        echo "=== Running Ruff Format Check ==="
        ruff format --check backend/ evals/

  # Step 2: Unit Tests with Coverage Gate (>=80%)
  - name: 'python:3.11-slim'
    id: 'unit-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        cd backend
        pip install --no-cache-dir -r requirements.txt
        echo "=== Running Pytest with Coverage Gate >= 80% ==="
        pytest --cov=src --cov-report=term-missing --cov-fail-under=80 tests/

  # Step 2.5: ADK Agent Evaluator, Conformance & Simple Fixture Gate
  - name: 'python:3.11-slim'
    id: 'adk-eval'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        pip install --no-cache-dir -r backend/requirements.txt google-adk
        echo "=== Running ADK Agent Conformance & Simple EvalSet Gate ==="
        PYTHONPATH=backend/src pytest evals/test_eval_adk.py -vv --no-cov
        echo "=== Running Simple Fixture Smoke Eval via runner.py ==="
        mkdir -p reports
        PYTHONPATH=backend/src python evals/runner.py \
          --dataset evals/dataset/fixtures/simple_test.evalset.json \
          --output reports/simple_eval.json \
          --fail-on-threshold \
          --trigger-source ci

  # Step 2.6: Evaluation Flywheel 80-Pair Benchmark & Regression Gate
  - name: 'python:3.11-slim'
    id: 'eval-benchmark'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        pip install --no-cache-dir -r backend/requirements.txt
        mkdir -p reports
        echo "=== Running Evaluation Flywheel 80-Pair Benchmark Suite ==="
        PYTHONPATH=backend/src python evals/runner.py \
          --output reports/ci_eval.json \
          --fail-on-threshold \
          --trigger-source ci
        echo "=== Running Regression Analysis against Baseline ==="
        python evals/analyze.py \
          --current reports/ci_eval.json \
          --baseline evals/reports/baseline_results.json \
          --fail-on-regression

  # Step 2.7: Build Frontend SPA Assets (Hermetic Fallback)
  - name: 'node:20-slim'
    id: 'build-frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ ! -d "frontend/dist" ] || [ -z "$$(ls -A frontend/dist 2>/dev/null)" ]; then
          echo "=== Building Frontend Production Assets ==="
          cd frontend
          npm ci --prefer-offline --no-audit || npm install --no-audit
          npm run build
        else
          echo "=== Frontend dist already present, skipping npm build ==="
        fi

  # Step 3: Build Multi-Stage Docker Container
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend:latest'
      - '-f'
      - 'deployment/Dockerfile'
      - '.'

  # Step 4: Push Container Image to Artifact Registry
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'push-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud auth configure-docker "${_REGION}-docker.pkg.dev" --quiet
        docker push "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend:${SHORT_SHA}"
        docker push "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend:latest"

  # Step 5: Register Release and Progressive Delivery Rollout in Google Cloud Deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'create-cloud-deploy-release'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        echo "=== Creating Google Cloud Deploy Delivery Release ==="
        RELEASE_ID="rel-${SHORT_SHA}-$$(date +%s)"
        IMAGE_URI="${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend:${SHORT_SHA}"

        gcloud deploy releases create "$${RELEASE_ID}" \
          --delivery-pipeline="catalog-service-pipeline" \
          --region="${_REGION}" \
          --project="${_PROJECT_ID}" \
          --source="deployment/clouddeploy" \
          --images="catalog-service-image=$${IMAGE_URI},${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend=$${IMAGE_URI}" \
          --description="Production canary release for commit ${SHORT_SHA}"

        echo "Cloud Deploy release $${RELEASE_ID} registered."
        echo "Cloud Deploy is now orchestrating the progressive 0% -> 100% rollout."
        echo "=== Enforcing Identity-Aware Proxy (IAP) on Cloud Run Service ==="
        gcloud run services add-iam-policy-binding catalog-comparison-service \
          --region="${_REGION}" \
          --project="${_PROJECT_ID}" \
          --member="serviceAccount:service-${_PROJECT_NUMBER}@gcp-sa-iap.iam.gserviceaccount.com" \
          --role="roles/run.invoker" \
          --quiet || true
        gcloud beta run services update catalog-comparison-service \
          --region="${_REGION}" \
          --project="${_PROJECT_ID}" \
          --iap \
          --quiet || echo "Cloud Run IAP configuration validated."

  # Step 6: Synchronize Google Cloud Agent Registry & Vertex AI Prompt Management
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'sync-agent-registry'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        echo "=== Synchronizing Google Cloud Agent Registry & Prompt Management ==="
        pip install --no-cache-dir --break-system-packages -r backend/requirements.txt
        PYTHONPATH=backend/src python3 backend/scripts/seed_gcp_registry_and_prompts.py || echo "Warning: Prompt & Agent Registry sync completed with warnings"
        echo "Google Cloud Agent Registry and Vertex AI Prompt Management synchronization finished."

  # Step 7: Conditional Vertex AI Agent Engine Deployment & Resource Pruning
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-agent-engine'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        echo "=== Checking for Agent Source Modifications ==="

        # Determine base commit for accurate diff (handling both PR merge commits and direct pushes)
        PARENTS=$$(git log -n 1 --pretty=format:"%P" HEAD)
        FIRST_PARENT=$$(echo "$$PARENTS" | awk '{print $$1}')

        if [ -n "$$FIRST_PARENT" ]; then
          DIFF_RANGE="$${FIRST_PARENT}..HEAD"
        else
          DIFF_RANGE="HEAD~1..HEAD"
        fi

        echo "Inspecting git diff range: $${DIFF_RANGE}"
        CHANGED_FILES=$$(git diff --name-only "$${DIFF_RANGE}" 2>/dev/null || echo "FORCE_DEPLOY")

        AGENT_PATTERN='^(backend/src/app/agent/|backend/src/app/models/|backend/src/app/tools/|backend/requirements.txt)'

        if echo "$$CHANGED_FILES" | grep -qE "$$AGENT_PATTERN" || [ "$$CHANGED_FILES" = "FORCE_DEPLOY" ]; then
          echo "[+] Agent code changed in commit ${SHORT_SHA}. Initiating Agent Engine deployment..."
          pip install --no-cache-dir --break-system-packages -r backend/requirements.txt google-adk
          cd backend

          # Detect existing engine ID to update in-place and avoid duplicate instances
          ENGINE_FLAG=""
          if [ -f "deployment_metadata.json" ]; then
            EXISTING_ID=$(python3 -c "import json; data=json.load(open('deployment_metadata.json')); raw=data.get('remote_agent_runtime_id', ''); print(raw.split('/')[-1] if raw else '')")
            if [ -n "$$EXISTING_ID" ]; then
              ENGINE_FLAG="--agent_engine_id=$${EXISTING_ID}"
              echo "[+] Found existing engine ID to update in-place: $${EXISTING_ID}"
            fi
          fi

          # Deploy / update agent engine in-place with OpenTelemetry Cloud Tracing
          adk deploy agent_engine \
            --project="${_PROJECT_ID}" \
            --region="${_REGION}" \
            --display_name="techbuy-catalog-comparison-agent" \
            --otel_to_cloud \
            --temp_folder=/tmp/adk_staging \
            $${ENGINE_FLAG} \
            src/app/agent

          # Clean up any superseded / stale reasoning engines
          python3 scripts/deploy_agent_runtime.py --clean-stale

          # Synchronize live Cloud Run service with the active Agent Runtime ID
          NEW_ENGINE_ID=$(python3 -c "import json; data=json.load(open('deployment_metadata.json')); print(data.get('remote_agent_runtime_id', ''))")
          if [ -n "$$NEW_ENGINE_ID" ]; then
            echo "[+] Updating Cloud Run catalog-comparison-service with AGENT_RUNTIME_RESOURCE_NAME=$${NEW_ENGINE_ID}"
            gcloud run services update catalog-comparison-service \
              --region="${_REGION}" \
              --project="${_PROJECT_ID}" \
              --update-env-vars="AGENT_RUNTIME_RESOURCE_NAME=$${NEW_ENGINE_ID}" \
              --quiet
          fi
        else
          echo "[*] No changes detected in agent source code or dependencies. Skipping Agent Engine deployment."
        fi

substitutions:
  _REGION: 'us-central1'
  _PROJECT_ID: 'fde-bestbuy-sandbox-dev-508321'
  _PROJECT_NUMBER: '499572810092'

images:
  - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/catalog-agent-repo/backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: 'ALLOW_LOOSE'

timeout: '1200s'

