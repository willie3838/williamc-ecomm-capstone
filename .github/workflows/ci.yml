name: CI Quality Gate & Cloud Build Sync

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  quality-gate:
    name: Pre-Merge Quality & Docs Sync Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff pytest pytest-cov

      - name: Run Documentation Synchronization Gate
        run: |
          PYTHONPATH=. pytest backend/tests/test_docs_sync.py -v --no-cov

      - name: Run Backend Unit & Entity Balancing Tests
        run: |
          PYTHONPATH=. pytest backend/tests/test_entity_balancing.py backend/tests/test_relevance_gate.py -v --no-cov
