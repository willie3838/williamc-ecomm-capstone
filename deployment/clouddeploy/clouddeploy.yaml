apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: catalog-service-pipeline
description: Continuous Delivery pipeline managing canary 0% verification to 100% traffic cutover
serialPipeline:
  stages:
  - targetId: cloudrun-prod
    strategy:
      canary:
        runtimeConfig:
          cloudRun:
            automaticTrafficControl: true
        canaryDeployment:
          percentages: [0]
          verify: true
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: cloudrun-prod
description: Production Cloud Run deployment target for catalog-comparison-service
run:
  location: projects/fde-bestbuy-sandbox-dev-508321/locations/us-central1
executionConfigs:
- usages:
  - RENDER
  - DEPLOY
  - VERIFY
  serviceAccount: catalog-agent-sa@fde-bestbuy-sandbox-dev-508321.iam.gserviceaccount.com
  executionTimeout: 600s
---
apiVersion: deploy.cloud.google.com/v1
kind: Automation
metadata:
  name: catalog-service-pipeline/auto-advance-and-rollback
description: Automatically advances from 0% canary to 100% upon verification success, and rolls back on failure
suspended: false
serviceAccount: catalog-agent-sa@fde-bestbuy-sandbox-dev-508321.iam.gserviceaccount.com
selector:
  targets:
  - id: cloudrun-prod
rules:
- advanceRolloutRule:
    id: advance-to-stable
    sourcePhases: ["canary-0"]
    wait: 0s
- rollbackRule:
    id: rollback-on-failure
