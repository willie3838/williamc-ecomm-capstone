apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: catalog-comparison-service
manifests:
  rawYaml:
    - service.yaml
deploy:
  cloudrun: {}
verify:
  - name: candidate-health-check
    container:
      name: health-probe
      image: curlimages/curl:8.10.1
      command: ["/bin/sh"]
      args:
        - "-c"
        - |
          set -euo pipefail
          echo "=== Starting Candidate Post-Deploy Verification ==="
          RAW_URL="${CLOUD_RUN_SERVICE_URLS:-${CLOUD_RUN_SERVICE_URL:-https://catalog-comparison-service-ocj5dik5ra-uc.a.run.app}}"
          TARGET_URL="$(echo "${RAW_URL}" | awk '{print $1}')"
          case "${TARGET_URL}" in
            http://*|https://*) ;;
            *) TARGET_URL="https://${TARGET_URL}" ;;
          esac
          echo "Target service endpoint: ${TARGET_URL}"

          AUTH_HEADER=""
          ID_TOKEN=$(curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience=${TARGET_URL}" 2>/dev/null || true)
          if [ -n "${ID_TOKEN}" ]; then
            AUTH_HEADER="Authorization: Bearer ${ID_TOKEN}"
          fi

          echo "1. Probing /health liveness endpoint..."
          CODE=$(curl -s -o /dev/null -w "%{http_code}" ${AUTH_HEADER:+-H "$AUTH_HEADER"} "${TARGET_URL}/health" || true)
          echo "Liveness probe returned HTTP ${CODE}"
          if [ "${CODE}" != "200" ] && [ "${CODE}" != "302" ]; then
            echo "Health probe failed with HTTP ${CODE}"
            exit 1
          fi

          echo "2. Probing /health/ready readiness endpoint..."
          CODE_READY=$(curl -s -o /dev/null -w "%{http_code}" ${AUTH_HEADER:+-H "$AUTH_HEADER"} "${TARGET_URL}/health/ready" || true)
          echo "Readiness probe returned HTTP ${CODE_READY}"
          if [ "${CODE_READY}" != "200" ] && [ "${CODE_READY}" != "302" ]; then
            echo "Readiness probe failed with HTTP ${CODE_READY}"
            exit 1
          fi

          echo "3. Probing OpenAPI documentation endpoint..."
          CODE_OPENAPI=$(curl -s -o /dev/null -w "%{http_code}" ${AUTH_HEADER:+-H "$AUTH_HEADER"} "${TARGET_URL}/openapi.json" || true)
          echo "OpenAPI probe returned HTTP ${CODE_OPENAPI}"
          if [ "${CODE_OPENAPI}" != "200" ] && [ "${CODE_OPENAPI}" != "302" ]; then
            echo "OpenAPI probe failed with HTTP ${CODE_OPENAPI}"
            exit 1
          fi

          echo "All candidate verification probes passed successfully."
